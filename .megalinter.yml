# Configuration file for MegaLinter
#
# See all available variables at https://megalinter.io/latest/config-file/ and in
# linters documentation
---
APPLY_FIXES: none

DISABLE:
  - COPYPASTE
  - SPELL

DISABLE_LINTERS:
  # Disable in favour of eslint
  - JAVASCRIPT_STANDARD
  # We use dependabot for vulnerability monitoring and patching
  - REPOSITORY_GRYPE
  - REPOSITORY_OSV_SCANNER
  # Not needed in this repository
  - REPOSITORY_TRIVY
  # Disable in favour of eslint
  - TYPESCRIPT_STANDARD
  # Link check flags localhost links in the contributing docs
  - MARKDOWN_MARKDOWN_LINK_CHECK
  # V8R keeps giving false positives
  - YAML_V8R

SHOW_ELAPSED_TIME: true

FILEIO_REPORTER: false

# Config paths
JAVASCRIPT_ES_CONFIG_FILE: eslint.config.mjs
TYPESCRIPT_ES_CONFIG_FILE: eslint.config.mjs

# Executable overrides
CSS_STYLELINT_CLI_EXECUTABLE: ['./node_modules/.bin/stylelint']
JAVASCRIPT_ES_CLI_EXECUTABLE: ['./node_modules/.bin/eslint']
TYPESCRIPT_ES_CLI_EXECUTABLE: ['./node_modules/.bin/eslint']

# Linters configuration
# zizmor reads action repositories through the GitHub API
ACTION_ZIZMOR_UNSECURED_ENV_VARIABLES:
  - GITHUB_TOKEN
